<meta charset="utf-8">
<script>
// para inserir o numero
var nota1 = Number(prompt("Insira sua nota no primeiro semestre : "));
var nota2 = Number(prompt("Insira sua nota no primeiro segundo : "));
var nota3 = Number(prompt("Insira sua nota no primeiro terceiro : "));
var nota4 = Number(prompt("Insira sua nota no primeiro terceiro : "));
var media = (nota1 + nota2 + nota3 + nota4)/4;
// apresenta as respostas
alert("Sua média é : " + media.toFixed(1));

</script>
